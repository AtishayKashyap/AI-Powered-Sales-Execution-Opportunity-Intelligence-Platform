# Local stack: docker compose up --build, then open http://localhost:5173
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: salesforge
      POSTGRES_USER: salesforge
      POSTGRES_PASSWORD: salesforge
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesforge"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    image: python:3.13-slim
    working_dir: /app/backend
    command: >
      sh -c "pip install -q -r requirements.txt &&
             salesforge migrate && salesforge seed &&
             uvicorn salesforge.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://salesforge:salesforge@postgres:5432/salesforge
      CORS_ORIGINS: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes: [".:/app", "/app/frontend/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
