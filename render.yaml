services:
  - type: web
    name: salesforge-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.app.seed_db && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: salesforge-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://salesforge-frontend.onrender.com

  - type: web
    name: salesforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://salesforge-api-5c6d.onrender.com

databases:
  - name: salesforge-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: salesforge
