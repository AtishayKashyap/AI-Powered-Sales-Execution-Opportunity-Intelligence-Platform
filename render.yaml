# Render free tier. The database is Neon (free, does not expire); paste its pooled connection
# string into DATABASE_URL. Schema and demo data are loaded by the "Reset demo data" workflow.
services:
  - type: web
    name: salesforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: salesforge migrate && uvicorn salesforge.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://salesforge-frontend.onrender.com
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: salesforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://salesforge-api-5c6d.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
