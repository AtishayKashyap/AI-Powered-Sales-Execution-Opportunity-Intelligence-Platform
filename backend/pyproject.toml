[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "salesforge"
version = "2.0.0"
description = "Prioritised sales opportunities for CPG field teams, with grounded LLM explanations"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
pipeline = ["numpy>=2.0,<3", "pandas>=2.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[project.scripts]
salesforge = "salesforge.cli:main"

[tool.setuptools.packages.find]
include = ["salesforge*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]  # the rupee sign is intentional

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["salesforge"]

[[tool.mypy.overrides]]
module = "salesforge.pipeline.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
