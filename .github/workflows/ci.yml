name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salesforge
          POSTGRES_PASSWORD: salesforge
          POSTGRES_DB: salesforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesforge" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest --cov=salesforge --cov-report=term-missing --cov-fail-under=85
      - name: Seed data is reproducible from the pipeline
        run: |
          salesforge pipeline --skip-evaluation --out /tmp/seed
          for f in reps outlets opportunities; do diff -q /tmp/seed/$f.csv ../data/seed/$f.csv; done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
