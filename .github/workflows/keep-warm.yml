name: Keep demo warm

# Render's free plan sleeps after 15 idle minutes (first request then takes ~50 s).
# Pinging during Indian working hours keeps the demo responsive; ~470 of the 750 free hours a month.
on:
  schedule:
    - cron: "*/10 3-17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://salesforge-api-5c6d.onrender.com/health
